# LiveKit — desarrollo (LAN Wi-Fi + 4G via IP publica / UPnP)
# Arranque: livekit-server --config infra/livekit.dev.yaml --dev --udp-port 7882 --node-ip <IP_PUBLICA>
#
# Senal movil/web: wss://PUBLIC_DOMAIN/rtc (Caddy :443).
# Media: TCP 7881 + UDP 7882 + TURN UDP 3478 (UPnP en router).

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  congestion_control:
    enabled: true
    allow_pause: false

# TURN embebido (4G con UDP bloqueado). relay en 7882/7881 — no rango 50000+ (UPnP no lo abre).
turn:
  enabled: true
  domain: 189.152.200.238
  udp_port: 3478

logging:
  level: info
