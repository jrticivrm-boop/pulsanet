<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SICOM" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SICOM — Sistema de Comunicaciones para Operaciones Militares</title>
    <link rel="icon" type="image/png" href="/brand/sicom_round.png" />
    <link rel="apple-touch-icon" href="/brand/sicom_round.png" />
    <link rel="apple-touch-icon" href="/brand/sicom.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tacticalptx_theme');
          /* Legacy `dark`/`oscuro` = HUD oliva → verde; nuevo obscuro = PV */
          if (t === 'dark' || t === 'oscuro') t = 'verde';
          if (t !== 'light' && t !== 'verde' && t !== 'obscuro') t = 'light';
          if (localStorage.getItem('tacticalptx_theme') !== t) {
            try {
              localStorage.setItem('tacticalptx_theme', t);
            } catch (e2) {}
          }
          document.documentElement.setAttribute('data-theme', t);
          /* Favicon Obscuro = Tactical 4 (antes de hidratar React). */
          if (t === 'obscuro') {
            var iconHref = '/brand/tactical_favicon_obscuro.png?v=1';
            var icon = document.querySelector('link[rel="icon"]');
            if (icon) icon.href = iconHref;
            var apples = document.querySelectorAll('link[rel="apple-touch-icon"]');
            for (var i = 0; i < apples.length; i++) {
              var h = apples[i].getAttribute('href') || '';
              if (h.indexOf('sicom_round') !== -1 || h.indexOf('tactical_favicon_obscuro') !== -1) {
                apples[i].href = '/brand/tactical_favicon_obscuro.png';
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
