<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#243d20" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TacticalPtx" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TacticalPtx — Radio PTT</title>
    <link rel="icon" type="image/png" href="/brand/tacticalptx.png" />
    <link rel="apple-touch-icon" href="/brand/tacticalptx_round.png" />
    <link rel="apple-touch-icon" href="/brand/tacticalptx.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tacticalptx_theme');
          if (t !== 'light' && t !== 'dark') {
            t = 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
